<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171b14"><title>灰燼誓約｜開發測試版</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23111414'/%3E%3Cpath d='M16 3L21 14L16 29L11 14Z' fill='%23c5a468'/%3E%3Cpath d='M7 13H25V17H7Z' fill='%23e2d5b9'/%3E%3C/svg%3E"><link rel="stylesheet" href="app.css"></head><body>
<main id="game"><div id="orientationHint" role="status">請橫放手機遊玩；直向時進度仍會持續。</div><canvas id="world" aria-label="遊戲世界，點地面移動，點怪物選取攻擊"></canvas><header id="identity"><button id="character" aria-label="角色屬性"><span id="classMark">旅人</span></button><div id="identityName"><span id="heroName">灰燼誓約</span><small id="level">新的旅程</small></div><div class="meters"><div class="meter hp"><i id="hpBar"></i><span id="hpText">HP</span></div><div class="meter mp"><i id="mpBar"></i><span id="mpText">MP</span></div></div></header><div id="location"><span id="mapName"></span><small id="coordinates"></small></div><button id="autoState">自動狩獵</button><div id="target" hidden></div><div id="messageLog" aria-live="polite"></div><button id="recenter" aria-label="角色視角固定置中" hidden>已置中</button><nav id="menus" aria-label="遊戲選單"><button data-panel="bag" aria-label="行囊" title="行囊"><img src="art/ui/assets/bag.webp" alt=""><span>行囊</span></button><button data-panel="skills" aria-label="技能" title="技能"><img src="art/ui/assets/skills.webp" alt=""><span>技能</span></button><button data-panel="pets" aria-label="寵物" title="寵物"><img src="art/ui/assets/pets.webp" alt=""><span>寵物</span></button><button data-panel="quests" aria-label="任務" title="任務"><img src="art/ui/assets/quests.webp" alt=""><span>任務</span></button><button data-panel="map" aria-label="地圖" title="地圖"><img src="art/ui/assets/map.webp" alt=""><span>地圖</span></button><button data-panel="settings" aria-label="選單" title="選單"><img src="art/ui/assets/settings.webp" alt=""><span>選單</span></button></nav><footer id="hotbar"><button data-use="ITEM-RED-POTION"><b>紅水</b><small id="redCount">0</small></button><button data-use="ITEM-BLUE-POTION"><b>藍水</b><small id="blueCount">0</small></button><button data-skill-slot="0"><b id="slot0">未指定</b><small>技能 I</small></button><button data-skill-slot="1"><b id="slot1">未指定</b><small>技能 II</small></button><button data-skill-slot="2"><b id="slot2">未指定</b><small>技能 III</small></button><button data-use="ITEM-RETURN-SCROLL"><b>回城</b><small id="returnCount">0</small></button></footer><div id="toast" role="status" hidden></div></main>
<dialog id="panel"><div id="panelBody"></div></dialog><div id="loading"><div><h1>灰燼誓約</h1><p class="fine">開發測試版</p><p id="loadingText">讀取旅途…</p><progress id="progress" max="1" value="0"></progress><button id="pause" hidden>暫停結算</button><p class="fine">進度只保存在這個瀏覽器；請定期匯出備份。</p></div></div><input id="importFile" type="file" accept=".json,application/json" hidden><script type="module" src="app.mjs"></script></body></html>
